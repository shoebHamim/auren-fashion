# Production stack for one VPS (PLAN §25.2.1). From the repo root:
#   docker compose -f infra/deploy/compose.yml --env-file infra/deploy/.env up -d --build
# `migrate` runs (and must succeed) before api/worker start on every `up`.
name: auren-prod

x-api-image: &api-image
  image: auren-api:${AUREN_VERSION:-latest}
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://auren_app:${AUREN_APP_DB_PASSWORD}@postgres:5432/auren
  WEB_ORIGIN: ${WEB_ORIGIN}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TLS_MODE: ${TLS_MODE:-origin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    logging: *logging

  web:
    image: auren-web:${AUREN_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  api:
    <<: *api-image
    restart: unless-stopped
    environment: *api-env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  worker:
    <<: *api-image
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  migrate:
    <<: *api-image
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    restart: 'no'
    environment:
      DATABASE_MIGRATOR_URL: postgres://auren_migrator:${AUREN_MIGRATOR_DB_PASSWORD}@postgres:5432/auren
      DATABASE_URL: postgres://auren_app:${AUREN_APP_DB_PASSWORD}@postgres:5432/auren
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'log_min_duration_statement=250',
      ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auren
      AUREN_APP_DB_PASSWORD: ${AUREN_APP_DB_PASSWORD}
      AUREN_MIGRATOR_DB_PASSWORD: ${AUREN_MIGRATOR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auren']
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: reachable only on the internal Docker network.
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
