packages:
  - apps/*
  - packages/*

# Toolchain enforcement (PLAN §5)
engineStrict: true

# Every dependency version comes from the catalog below (one version per package).
catalogMode: strict

# Supply-chain guard (PLAN §22, T14): new releases must be ≥ 1 day old,
# except packages where same-day security patches must be installable.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - better-auth

# Install scripts: explicit allow (true) or deny (false) per package.
allowBuilds:
  esbuild: true
  # testcontainers → ssh2 optional native speed-ups / version checks; not needed
  cpu-features: false
  ssh2: false
  protobufjs: false

catalog:
  # tooling
  typescript: ^6.0.3
  turbo: ^2.11.7
  prettier: ^3.9.9
  eslint: ^10.11.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.71.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  '@next/eslint-plugin-next': ^16.3.8
  globals: ^17.13.0
  '@types/node': ^24.19.1
  tsx: ^4.23.15
  tsup: ^8.5.1
  vitest: ^5.0.3
  '@testcontainers/postgresql': ^12.2.0
  '@playwright/test': ^1.63.0
  # shared runtime
  zod: ^4.6.5
  uuidv7: ^1.2.1
  # api / db
  hono: ^4.13.12
  '@hono/node-server': ^2.1.3
  '@hono/zod-openapi': ^1.6.3
  drizzle-orm: ^0.45.3
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  graphile-worker: ^0.18.0
  pino: ^10.3.0
  pino-pretty: ^13.1.3
  # web
  next: ^16.3.8
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  server-only: ^0.0.1
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  cn: ^0.4.0
  shadcn: ^4.21.1
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  radix-ui: ^1.6.7
  lucide-react: ^1.50.0
