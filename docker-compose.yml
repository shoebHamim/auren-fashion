# Local development infrastructure (PLAN §5, §25.3). Not used in production.
#   pnpm infra:up    → start and create buckets
#   pnpm infra:down  → stop (data is kept in named volumes; add -v to wipe)
name: auren

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auren
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=250
    ports:
      - '5433:5432' # 5432 is often taken by a host Postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auren']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for local dev (production: Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip=storage -ip.bind=0.0.0.0
    ports:
      - '9000:9000'
    volumes:
      - storagedata:/data
      - ./infra/storage/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9333/cluster/status >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches all outgoing email. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  storagedata:
